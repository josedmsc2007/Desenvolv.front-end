<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Pagina de Cadastro</h1>
    <fieldset>
        <legend>Crie uma conta</legend>
        <h2>Registre-se</h2>
        <label for="nome">Nome</label>
        <br>
        <input type="text" id="nome" name="nome" required title="Nome Completo">
        <br>
        <label for="email">E-mail</label>
        <br>
        <input type="email" id="email" name="email" placeholder="Seuemail@gmail.com" required title="Digite seu e-mail">
        <br>        
        <label for="senha">Senha (mínimo 8 caracteres)</label>
        <br>
        <input type="password" id="senha" name="senha" minlength="8" required title="Digite sua senha">
        <br>
        <br>
        <br>
        <h3>Gênero:</h3>
        <br>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label>
        <br>
        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label>
        <br>
        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>

        <br>
        <br>
        <br>
        <label for="bio">Biografia</label>
        <br>
        <textarea name="bio" id="bio" rows="6" cols="26" style="resize: none;" placeholder="Insira sua biografia..."></textarea>
        <br>

        <input type="radio" id="termos" name="termos" required>
        <label for="termos">Aceito os termos de serviço</label>
        
    </fieldset>
         <br>
         <br>
     <input type="submit" value="Cadastrar">
     <input type="reset" value="Limpar">

     <style>
        label {
            font-weight: bold;
        }
     </style>
</body>
</html>
