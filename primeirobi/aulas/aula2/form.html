<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <fieldset>
        <legend>Registre-se</legend>
        <h3>Informe seus dados para realizar o registro</h3>
    <form action="/url-api-back-end" method="post">
    
        <label for="nome">Informe seu nome</label>
        <input type="text" id="nome" name="nome"
        title="Digite seu nome completo"
        pattern="[A-Za-z]+"
        placeholder="Nome" required maxlength="10">
        <br>


        <label for="email">Infome seu email<label>
        <input type="email" id="email" name="email"
         placeholder="E-mail" required>
        <br>


        <label for="senha">Informe sua senha</label>
        <input type="password" id="senha" name="senha"
         placeholder="Senha" required 
         minlength="6">
        
        <br>
        <label for="bio">Insira sua biografia</label>
        <br>
        <textarea name="bio" id="bio" rows="6" cols="26" style="resize: none;" placeholder="Insira..."></textarea>

        <br>
        <label for="time">Selecione o melhor time do BR</label>
        <br>
        <select name="melhor-time" id="time">
            <option value="" selected disabled>Selecione...</option> 
            <optgroup label="Times do Brasil">          
            <option value="Corinthians">Corinthians</option>
            <option value="Santos">Santos</option>
            <option value="Palmeiras">Palmeiras</option>
            <option value="Botafogo">Botafogo</option>
            <option value="Vasco">Vasco</option>

            
            </optgroup>
            <optgroup label="Times da Europa">
            <option value="Barcelona">Barcelona</option>
            <option value="Real Madrid">Real Madrid</option>
        </select>

       <br>
       <br>
       <input type="submit" value="Enviar">
    </form>
    
    </fieldset>
</body>

</html>
